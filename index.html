<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Weather</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <meta name="description" content="Weather web app" />
    </head>

    <body>

        <header>
            <img src="assets/weather-logo.svg" alt="meteo-logo" class="logo" />
            <h1>Weather</h1>
        </header>

        <main class="main-content">

            <div id="searchbar-container">
                <label class="label" for="search-bar">Please search a location</label>
                <input type="text" placeholder="Search..." required id="search-bar" />
            </div>

            <div id="result" class="results-style" hidden="true">
            </div>

        </main>

    </body>

    <script type="module" src="scripts/app.js"></script>

</html>
